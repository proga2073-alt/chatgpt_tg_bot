services:
  bot:
    build: .
    env_file: .env
    volumes:
      - botdata:/app/data   # БД SQLite и рабочие папки пользователей переживают пересоздание контейнера
    restart: unless-stopped

  # Необязательно: PostgreSQL вместо SQLite.
  # 1) раскомментируйте сервис ниже, 2) в .env задайте
  #    DATABASE_URL=postgresql+asyncpg://bot:botpass@db:5432/bot
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: bot
  #     POSTGRES_PASSWORD: botpass
  #     POSTGRES_DB: bot
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  botdata:
  # pgdata:
